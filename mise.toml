[settings]
dotfiles.root = "./dotfiles"

[dotfiles]
"~/.pi/agent/mcp.json" = "dotfiles/pi/agent/mcp.json"
"~/.config/starship.toml" = "dotfiles/starship/starship.toml"
"~/.config/ghostty/config.ghostty" = "dotfiles/ghostty/config.ghostty"
"~/.config/mise" = "dotfiles/mise"
"~/.zshrc" = "dotfiles/zsh/zshrc"
"~/.config/zsh/plugins.txt" = "dotfiles/zsh/plugins.txt"
"~/.emacs.d/early-init.el" = "dotfiles/emacs/early-init.el"
"~/.emacs.d/init.el" = "dotfiles/emacs/init.el"
"~/.emacs.d/post-init.el" = "dotfiles/emacs/post-init.el"
"~/.bashrc" = "dotfiles/bash/bashrc"
"~/.bash_profile" = "dotfiles/bash/bash_profile"

[tasks.update]
description = "Update flake inputs and packages"
run = ["nix flake update", "nix run .#update"]
