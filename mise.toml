[settings]
dotfiles.root = "./dotfiles"

[dotfiles]
"~/.pi/agent/settings.json" = "dotfiles/pi/agent/settings.json"
"~/.pi/agent/mcp.json" = "dotfiles/pi/agent/mcp.json"
"~/.config/kitty" = "dotfiles/kitty"
"~/.agents/skills" = "dotfiles/agents/skills"
"~/.config/starship.toml" = "dotfiles/starship/starship.toml"
"~/.claude/skills/nh" = "dotfiles/agents/skills/nh"
"~/.claude/skills/home-manager-rebuild" = "dotfiles/agents/skills/home-manager-rebuild"
"~/.config/ghostty/config.ghostty" = "dotfiles/ghostty/config.ghostty"
"~/.config/mise" = "dotfiles/mise"
"~/.zshrc" = "dotfiles/zsh/zshrc"
"~/.config/sheldon/plugins.toml" = "dotfiles/sheldon/plugins.toml"

[tasks.update]
description = "Update flake inputs and packages"
shell = "bash -c"
run = '''
set -euo pipefail
nix flake update
for dir in packages/*/; do
  attr=$(basename "$dir")
  cmd=()
  while IFS= read -r arg; do cmd+=("$arg"); done < <(nix eval --raw ".#$attr.updateScript" --apply 'c: builtins.concatStringsSep "\n" c + "\n"')
  nix build --no-link "$(nix eval --raw ".#$attr.updateScript" --apply 'c: (builtins.head c).drvPath')^*"
  UPDATE_NIX_ATTR_PATH=$attr "${cmd[@]}"
done
'''
