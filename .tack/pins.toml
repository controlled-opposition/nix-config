# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
gh = "github:{path}"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
nixpkgs = ["nixos-unstable"]

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
[inputs]

[inputs.nix-darwin]
url = "gh:nix-darwin/nix-darwin/master"

[inputs.nix-flatpak]
url = "gh:gmodena/nix-flatpak"

[inputs.nix-homebrew]
url = "gh:zhaofengli/nix-homebrew"

[inputs.nixos-wsl]
url = "gh:nix-community/NixOS-WSL"

[inputs.nixpkgs]
url = "gh:NixOS/nixpkgs/nixos-unstable"

[inputs.tack]
url = "gh:manic-systems/tack"

[inputs.helium-flake]
url = "gh:amaanq/helium-flake"

[inputs.chaotic]
url = "gh:chaotic-cx/nyx"
exclude_follow = ["nixpkgs"]

[inputs.llm-agents]
url = "gh:numtide/llm-agents.nix"
exclude_follow = ["nixpkgs"]

[inputs.emacs-overlay]
url = "gh:nix-community/emacs-overlay"
type = "fetch"

[inputs.import-tree]
url = "gh:denful/import-tree"

[inputs.hjem]
url = "gh:feel-co/hjem"

[inputs.hjem-impure]
url = "gh:Rexcrazy804/hjem-impure"

[inputs.nvf]
url = "gh:NotAShelf/nvf"

[inputs.pstack]
url = "gh:cursor/plugins"
type = "fetch"
