# Compositor bindings from the packaged example.
# Unmentioned built-ins remain active: H/J/K/L, Shift+arrows, 1–9,
# Shift+1–9, R/Shift+R, F/Ctrl+F, comma/period, and Escape.
# https://docs.noctalia.dev/umbriel/keybinds/
[keybinds]
"Mod+Q" = "window-close"

"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"

"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"

"Mod+T" = "window-toggle-floating"
"Mod+Shift+T" = "window-focus-switch-floating"
"Mod+P" = "window-toggle-pinned"
"Mod+M" = "window-toggle-maximize"
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+F" = "window-toggle-fullscreen"

"Mod+Shift+S" = "window-move-to-scratchpad"
"Mod+S" = "scratchpad-toggle"
"Mod+Ctrl+S" = "window-restore-from-scratchpad"
"Mod+Tab" = "scratchpad-focus-next"

"Mod+Return" = "spawn:kitty"
"Mod+E" = "spawn:dolphin"
"Mod+B" = "spawn:helium"

# Noctalia shortcuts.
# Shell integration. Mod+Space and Mod+L retain their compositor actions.
# https://docs.noctalia.dev/noctalia/compositor-settings/umbriel/
"Mod+D" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+N" = { action = "spawn:noctalia msg panel-toggle control-center", repeat = false }
"Mod+V" = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Ctrl+L" = { action = "spawn:noctalia msg session lock", repeat = false }
"Mod+Escape" = { action = "spawn:noctalia msg panel-toggle session", repeat = false }
"Mod+Comma" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
"Alt+Tab" = { action = "spawn:noctalia msg window-switcher", repeat = false }
"Print" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Shift+Print" = { action = "spawn:noctalia msg screenshot-fullscreen", repeat = false }

"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"

"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

"Mod+R" = "window-cycle-width"
"Mod+Shift+R" = "window-cycle-width-back"
"Mod+Alt+R" = "window-cycle-height"
"Mod+Alt+Shift+R" = "window-cycle-height-back"

"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "column-move-left"
"Mod+Shift+WheelDown" = "column-move-right"

# Hardware controls and their OSD remain available on the lock screen.
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn:noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn:noctalia msg media pause", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true, repeat = false }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }
