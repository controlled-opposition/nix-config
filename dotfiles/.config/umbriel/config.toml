# Citrus / Rick. Link with GNU Stow; see hosts/citrus/README.md.
# Based on the packaged example at the Umbriel revision in flake.lock.
# https://docs.noctalia.dev/umbriel/configuration/
# Validate: umbriel validate -c ~/.config/umbriel/config.toml

# Unspecified settings use Umbriel defaults.
[include]
files = [
  "outputs.toml",
  "keybinds.toml",
  "input.toml",
  "appearance.toml",
  "layout.toml",
  "window-rules.toml",
  "layer-rules.toml",
]

[general]
autostart = ["noctalia"]
xwayland = true
show_cheatsheet = true

[environment]
# Noctalia uses this for applications whose desktop entry has Terminal=true.
TERMINAL = "kitty"
