# Default session, input, appearance, and scrolling layout.
# Unspecified settings (including monitor modes) use Umbriel's defaults.
[general]
autostart = ["noctalia"]
xwayland = true
show_cheatsheet = true

[environment]
# Noctalia uses this for applications whose desktop entry has Terminal=true.
TERMINAL = "kitty"

[input.keyboard]
layout = ""
repeat_rate = 25
repeat_delay = 600

[input.touchpad]
tap = true

[input.mouse]
sensitivity = 0.0

[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 10

[layout]
mode = "scrolling"
gap = 8
width_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_width_fraction = 0.5
center_underfull_strip = true
center_focused = false
expand_single_column = true
